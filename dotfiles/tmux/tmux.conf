# Список плагинов
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'     # Сохраняет и восстанавливает сессии
set -g @plugin 'tmux-plugins/tmux-continuum'     # Автоматизирует сохранение

# Настройки tmux-continuum
set -g @continuum-restore 'on'                    # Автоматически восстанавливать сессию при старте
set -g @continuum-save-interval '15'              # Сохранять сессию каждые 15 минут

# Запуск TPM (эта строка всегда должна быть последней)
run '~/.tmux/plugins/tpm/tpm'

# Цвета для neovim
set -g default-terminal "screen-256color"

# Включаем мышь
set -g mouse on

# Больше истории
set -g history-limit 10000

# Меняем префикс на Ctrl-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Сплиты
bind | split-window -h
bind - split-window -v

# Быстрая навигация по панелям (без префикса)
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-j select-pane -D
bind -n C-k select-pane -U

# Быстрая перезагрузка конфигурации
bind r source-file ~/.tmux.conf \; display "Reloaded!"
